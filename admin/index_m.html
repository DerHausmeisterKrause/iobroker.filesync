<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../css/adapter.css"><link rel="stylesheet" href="../../lib/css/materialize.css"><script src="../../lib/js/jquery-3.2.1.min.js"></script><script src="../../socket.io/socket.io.js"></script><script src="../../lib/js/translate.js"></script><script src="../../lib/js/materialize.js"></script><script src="words.js"></script><style>:root{color-scheme:light dark}body{margin:0;font-family:Arial,sans-serif;background:var(--iobroker-background,#f5f6f8)}header{background:#1976d2;color:#fff;padding:18px 24px;display:flex;gap:14px;align-items:center}header img{width:42px}.tabs{display:flex;overflow:auto;background:#fff}.tabs button{border:0;background:transparent;padding:15px 20px;cursor:pointer;white-space:nowrap}.tabs button.active{color:#1976d2;border-bottom:3px solid #1976d2}main{padding:20px;max-width:1200px;margin:auto}.card{background:var(--iobroker-card-background,#fff);padding:18px;border-radius:8px;margin:12px 0;box-shadow:0 2px 7px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.metric{font-size:28px;font-weight:bold}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #8884}.action{background:#1976d2;color:#fff;border:0;border-radius:4px;padding:9px 13px;cursor:pointer}.notice{border-left:4px solid #f9a825;padding:10px}@media(max-width:600px){main{padding:8px}table,tbody,tr,td{display:block}thead{display:none}td:before{content:attr(data-label);font-weight:bold;margin-right:8px}}</style></head><body><header><img src="filesync.svg" alt=""><h1 class="translate">FileSync manager</h1></header><nav class="tabs" aria-label="Sections"></nav><main><section id="Dashboard"><div class="grid"><div class="card"><span class="translate">Connected</span><div class="metric" id="connected">—</div></div><div class="card"><span class="translate">Locations</span><div class="metric" id="locationCount">—</div></div><div class="card"><span class="translate">Jobs</span><div class="metric" id="jobCount">—</div></div></div><button class="action translate" onclick="refresh()">Refresh</button></section><section id="Locations" class="hidden"><div class="card notice translate">Security note</div><div class="card"><table><thead><tr><th>Name</th><th>Type</th><th>Target</th><th>Credentials</th></tr></thead><tbody id="locations"></tbody></table></div></section><section id="Jobs" class="hidden"><div class="card"><table><thead><tr><th>Name</th><th>Mode</th><th>Trigger</th><th>Status</th><th>Action</th></tr></thead><tbody id="jobs"></tbody></table></div></section><section id="Users & groups" class="hidden"><div class="card"><p>FileSync roles use existing ioBroker user identifiers. Access checks are enforced by the adapter backend.</p></div></section><section id="Notifications" class="hidden"><div class="card"><p>E-mail delivery uses an installed ioBroker e-mail adapter instance.</p></div></section><section id="Diagnostics" class="hidden"><div class="card"><pre id="diag"></pre></div></section></main><script>let instance=0;const names=['Dashboard','Locations','Jobs','Users & groups','Notifications','Diagnostics'];function t(s){return typeof _==='function'?_(s):s}function tab(name){document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==name));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.name===name))}document.querySelector('.tabs').innerHTML=names.map((n,i)=>`<button data-name="${n}" class="${i?'':'active'}">${t(n)}</button>`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.name));function esc(v){const e=document.createElement('span');e.textContent=String(v??'');return e.innerHTML}function call(command,message={}){return new Promise((resolve,reject)=>sendTo(`filesync.${instance}`,command,{...message,user:'system.user.admin'},r=>r&&r.ok?resolve(r.data):reject(new Error(r?.error||'No response'))))}async function refresh(){try{const [s,l,j]=await Promise.all([call('status'),call('listLocations'),call('listJobs')]);connected.textContent=s.connected?'✓':'✕';locationCount.textContent=s.locations;jobCount.textContent=s.jobs;locations.innerHTML=l.length?l.map(x=>`<tr><td data-label="Name">${esc(x.name)}</td><td data-label="Type">${esc(x.type)}</td><td data-label="Target">${esc(x.target)}</td><td data-label="Credentials">${x.hasPassword||x.hasPrivateKey?'••••••••':'—'}</td></tr>`).join(''):`<tr><td>${t('No records')}</td></tr>`;jobs.innerHTML=j.length?j.map(x=>`<tr><td data-label="Name">${esc(x.name)}</td><td data-label="Mode">${esc(x.mode)}</td><td data-label="Trigger">${esc(x.trigger.type)}</td><td data-label="Status">${x.enabled?'idle':'disabled'}</td><td><button class="action" onclick="run('${esc(x.id)}')">▶</button></td></tr>`).join(''):`<tr><td>${t('No records')}</td></tr>`;diag.textContent=JSON.stringify(s,null,2)}catch(e){M.toast({html:esc(e.message)})}}async function run(id){try{await call('runJob',{id});M.toast({html:'Job started'})}catch(e){M.toast({html:esc(e.message)})}}function load(settings,onChange){instance=settings._id?.split('.').pop()||0;refresh();onChange(false)}function save(callback){callback({})}</script></body></html>
