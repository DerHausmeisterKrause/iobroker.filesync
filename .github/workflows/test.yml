name: Test and Release
on: [push, pull_request]
permissions: {contents: read}
jobs:
  checks:
    name: ${{ matrix.check }} (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        check: [lint, typecheck, unit, build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      # Switch to npm ci as soon as package-lock.json can be generated.
      - run: npm install
      - if: matrix.check == 'lint'
        run: npm run lint
      - if: matrix.check == 'typecheck'
        run: npm run typecheck
      - if: matrix.check == 'unit'
        run: npm test
      - if: matrix.check == 'build'
        run: npm run build
      - if: matrix.check == 'package'
        run: npm run test:package && npm pack --dry-run
