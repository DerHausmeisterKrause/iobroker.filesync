<style>
:root{--blue:#1976d2;--red:#c62828;--green:#2e7d32}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#263238}header{background:var(--blue);color:white;padding:15px 24px;display:flex;gap:13px;align-items:center}header img{width:42px}header h1{font-size:24px;margin:0}.tabs{display:flex;overflow:auto;background:white}.tabs button{border:0;background:transparent;padding:15px 20px;cursor:pointer}.tabs button.active{color:var(--blue);border-bottom:3px solid var(--blue)}main{padding:20px;max-width:1400px;margin:auto}.card{background:white;padding:18px;border-radius:8px;margin:12px 0;box-shadow:0 2px 7px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.metric{font-size:28px;font-weight:bold}.hidden{display:none!important}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd;vertical-align:top}.btnx{background:var(--blue);color:white;border:0;border-radius:4px;padding:9px 12px;margin:3px;cursor:pointer}.btnx.secondary{background:#607d8b}.btnx.danger{background:var(--red)}.btnx:disabled{opacity:.5;cursor:not-allowed}.pill{display:inline-block;padding:3px 8px;border-radius:12px;background:#eceff1}.pill.success{background:#c8e6c9}.pill.error{background:#ffcdd2}.warning{border-left:5px solid #f9a825;padding:10px;background:#fff8e1}.danger-note{border-left-color:var(--red);background:#ffebee}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.overlay{position:fixed;inset:0;background:#0008;z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:3vh 10px;overflow:auto}.dialog{background:white;border-radius:8px;padding:20px;width:min(850px,96vw);max-height:94vh;overflow:auto}.dialog h2{font-size:22px;margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}.field label{display:block;font-weight:bold;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;border:1px solid #aaa;border-radius:4px;padding:8px;height:auto}.field textarea{min-height:90px}.span2{grid-column:1/-1}.checks{display:flex;gap:18px;flex-wrap:wrap;padding:9px 0}.checks label{color:inherit}.browser-entry{display:block;width:100%;text-align:left;padding:10px;border:0;border-bottom:1px solid #ddd;background:white;cursor:pointer}.crumb{border:0;background:transparent;color:var(--blue);cursor:pointer;padding:4px}.run-summary{margin-top:12px}.run-items{max-height:260px;overflow:auto;font-family:monospace}.muted{color:#607d8b;font-size:13px}@media(max-width:750px){main{padding:8px}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}table,tbody,tr,td{display:block}thead{display:none}tr{margin-bottom:15px;border:1px solid #ddd}td:before{content:attr(data-label) ': ';font-weight:bold}}
</style></head><body>
<header><img src="filesync.svg" alt="FileSync"><h1>FileSync Test-MVP</h1></header><nav class="tabs"></nav><main>
<div id="runtimeError" class="warning danger-note hidden" role="alert"></div>
<section id="Dashboard"><div class="grid"><div class="card"><span>Adapter connected</span><div class="metric" id="connected">—</div></div><div class="card"><span>Locations</span><div class="metric" id="locationCount">—</div></div><div class="card"><span>Jobs</span><div class="metric" id="jobCount">—</div></div><div class="card"><span>Active runs</span><div class="metric" id="activeCount">—</div></div></div><button class="btnx" onclick="refresh()">Refresh</button></section>
<section id="Locations" class="hidden"><div class="toolbar"><h2>Datenorte</h2><button class="btnx" onclick="editLocation()">+ Datenort hinzufügen</button></div><div class="card"><table><thead><tr><th>Name</th><th>Typ</th><th>Ziel</th><th>Aktiv</th><th>ReadOnly</th><th>Credentials</th><th>Aktionen</th></tr></thead><tbody id="locationsBody"></tbody></table></div></section>
<section id="Jobs" class="hidden"><div class="toolbar"><h2>Jobs</h2><button class="btnx" onclick="editJob()">+ Job hinzufügen</button></div><div class="card"><table><thead><tr><th>Name</th><th>Source</th><th>Target</th><th>Mode</th><th>Trigger</th><th>Enabled</th><th>DryRun</th><th>Status</th><th>Aktionen</th></tr></thead><tbody id="jobsBody"></tbody></table></div><div id="runPanel"></div></section>

</main><div id="modalRoot"></div>
<script>
'use strict';let adapterInstance=null,nativeSettings={},locationList=[],jobList=[],runPoll=null,browseState=null;const tabs=['Dashboard','Locations','Jobs','Diagnostics'];
const E=v=>{const x=document.createElement('span');x.textContent=String(v??'');return x.innerHTML},q=id=>document.getElementById(id),uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:r&3|8).toString(16)});
function toast(message,good=false){if(typeof M!=='undefined'&&M&&typeof M.toast==='function')M.toast({html:`<span style="color:${good?'#b9f6ca':'#fff'}">${E(message)}</span>`,displayLength:5000})}function err(e){const message=e&&e.message?e.message:String(e),box=q('runtimeError');if(box){box.textContent=message;box.classList.remove('hidden')}toast(message)}
function checkAdminApi(){if(typeof sendTo==='function')return true;err(new Error('ioBroker Admin API konnte nicht geladen werden (sendTo unavailable).'));return false}
function call(command,message={}){return new Promise((resolve,reject)=>{if(typeof sendTo!=='function'){reject(new Error('ioBroker Admin sendTo API is unavailable'));return}if(adapterInstance===null){reject(new Error('ioBroker Admin instance information is unavailable'));return}sendTo(`filesync.${adapterInstance}`,command,message,r=>r&&r.ok?resolve(r.data):reject(new Error(r&&r.error?r.error:'No response from adapter')))})}
function showTab(name){document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==name));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.name===name));if(name==='Diagnostics')refresh()}
q('modalRoot').innerHTML='';document.querySelector('.tabs').innerHTML=tabs.map((n,i)=>`<button data-name="${n}" class="${i?'':'active'}">${n}</button>`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.name));
function closeModal(){q('modalRoot').innerHTML='';browseState=null}function closeTopModal(){q('modalRoot').lastElementChild?.remove();browseState=null}function modal(html,nested=false){const markup=`<div class="overlay" onclick="if(event.target===this)${nested?'closeTopModal()':'closeModal()'}"><div class="dialog">${html}</div></div>`;if(nested)q('modalRoot').insertAdjacentHTML('beforeend',markup);else q('modalRoot').innerHTML=markup}
async function refresh(){try{const [s,l,j]=await Promise.all([call('status'),call('listLocations'),call('listJobs')]);locationList=l;jobList=j;q('connected').textContent=s.connected?'✓':'✕';q('locationCount').textContent=s.locations;q('jobCount').textContent=s.jobs;q('activeCount').textContent=s.activeJobs;renderLocations();renderJobs();q('diagnostics').innerHTML=[['Adapter connected',s.connected?'yes':'no'],['Locations',s.locations],['Jobs',s.jobs],['Active Runs',s.activeJobs],['Failed Jobs',s.failedJobs??0],['Queued Transfers',s.queuedTransfers??0]].map(x=>`<div><div>${E(x[0])}</div><div class="metric">${E(x[1])}</div></div>`).join('')}catch(e){err(e)}}
function renderLocations(){q('locationsBody').innerHTML=locationList.length?locationList.map(l=>`<tr><td data-label="Name">${E(l.name)}</td><td data-label="Typ">${E(l.type)}</td><td data-label="Ziel">${E(l.target)}</td><td data-label="Aktiv">${l.enabled?'✓':'✕'}</td><td data-label="ReadOnly">${l.readOnly?'✓':'✕'}</td><td data-label="Credentials">${l.hasPassword||l.hasPrivateKey?'Passwort/Schlüssel gespeichert':'—'}</td><td data-label="Aktionen"><button class="btnx" onclick="editLocation('${l.id}')">Bearbeiten</button><button class="btnx secondary" onclick="testLocation('${l.id}')">Test</button><button class="btnx secondary" onclick="openBrowser('${l.id}',null,'')">Browse</button><button class="btnx secondary" onclick="duplicateLocation('${l.id}')">Duplizieren</button><button class="btnx danger" onclick="removeLocation('${l.id}')">Löschen</button></td></tr>`).join(''):'<tr><td colspan="7">Noch keine Datenorte.</td></tr>'}
function locationFields(type,l){const common=`<div class="field"><label>Name *</label><input id="lName" value="${E(l.name||'')}"></div><div class="field"><label>Beschreibung</label><input id="lDescription" value="${E(l.description||'')}"></div>`;let specific='';if(type==='local')specific=`<div class="field span2"><label>Basis-Pfad *</label><input id="lBasePath" placeholder="/tmp/filesync-source" value="${E(l.basePath||'')}"></div>`;if(type==='smb')specific=`<div class="field"><label>Host *</label><input id="lHost" value="${E(l.host||'')}"></div><div class="field"><label>Port</label><input id="lPort" type="number" value="${E(l.port||445)}"></div><div class="field"><label>Share *</label><input id="lShare" value="${E(l.share||'')}"></div><div class="field"><label>Domain</label><input id="lDomain" value="${E(l.domain||'')}"></div><div class="field"><label>Benutzername *</label><input id="lUsername" value="${E(l.username||'')}"></div><div class="field"><label>Passwort ${l.hasPassword?'(Passwort gespeichert)':''}</label><input id="lPassword" type="password" autocomplete="new-password" placeholder="${l.hasPassword?'••••••••':''}"></div><div class="field span2"><label>Basisordner</label><input id="lBasePath" value="${E(l.basePath||'')}"></div>`;if(type==='sftp')specific=`<div class="field"><label>Host *</label><input id="lHost" value="${E(l.host||'')}"></div><div class="field"><label>Port</label><input id="lPort" type="number" value="${E(l.port||22)}"></div><div class="field"><label>Username *</label><input id="lUsername" value="${E(l.username||'')}"></div><div class="field"><label>Authentifizierung</label><select id="lAuth" onchange="locationAuthChanged()"><option value="password" ${l.auth!=='privateKey'?'selected':''}>Passwort</option><option value="privateKey" ${l.auth==='privateKey'?'selected':''}>Private Key</option></select></div><div class="field auth-password"><label>Passwort ${l.hasPassword?'(gespeichert)':''}</label><input id="lPassword" type="password" autocomplete="new-password" placeholder="${l.hasPassword?'••••••••':''}"></div><div class="field auth-key"><label>Passphrase ${l.hasPassphrase?'(gespeichert)':''}</label><input id="lPassphrase" type="password" autocomplete="new-password"></div><div class="field span2 auth-key"><label>Private Key ${l.hasPrivateKey?'(gespeichert)':''}</label><textarea id="lPrivateKey" autocomplete="off"></textarea></div><div class="field"><label>Base Path *</label><input id="lBasePath" value="${E(l.basePath||'/')}"></div><div class="field"><label>Host Fingerprint</label><input id="lFingerprint" placeholder="SHA256:..." value="${E(l.hostFingerprint||'')}"></div><div class="checks span2"><label><input id="lInsecure" type="checkbox" ${l.allowInsecureHostKey?'checked':''}> Allow insecure host key</label></div>`;return common+specific+`<div class="field"><label>Timeout (ms)</label><input id="lTimeout" type="number" min="1000" value="${E(l.timeoutMs||30000)}"></div><div class="checks"><label><input id="lEnabled" type="checkbox" ${l.enabled!==false?'checked':''}> Aktiv</label><label><input id="lReadOnly" type="checkbox" ${l.readOnly?'checked':''}> Nur Lesen</label></div>`}
function editLocation(id,copy=false){const old=locationList.find(x=>x.id===id)||{},l=copy?{...old,id:uuid(),name:`${old.name||''} Kopie`,hasPassword:false,hasPrivateKey:false,hasPassphrase:false}:old,type=l.type||'local';modal(`<div class="toolbar"><h2>${id&&!copy?'Datenort bearbeiten':'Datenort hinzufügen'}</h2><button class="btnx secondary" onclick="closeModal()">Schließen</button></div><div class="field"><label>Typ</label><select id="lType" onchange="editLocationType()"><option value="local">Lokal</option><option value="smb">SMB</option><option value="sftp">SFTP</option></select></div><div id="locationForm" class="form-grid"></div><div><button class="btnx" onclick="saveLocation()">Speichern</button>${id&&!copy?`<button class="btnx secondary" onclick="testLocation('${id}')">Verbindung testen</button><button class="btnx secondary" onclick="openBrowser('${id}',null,'')">Ordner anzeigen</button>${old.hasPassword||old.hasPrivateKey||old.hasPassphrase?'<button class="btnx danger" onclick="deleteLocationSecret()">Gespeichertes Passwort/Schlüssel löschen</button>':''}`:''}</div>`);q('lType').value=type;q('lType').disabled=Boolean(id&&!copy);q('locationForm').dataset.id=l.id||uuid();q('locationForm').dataset.original=JSON.stringify(l);q('locationForm').innerHTML=locationFields(type,l);locationAuthChanged()}
function editLocationType(){const type=q('lType').value,id=q('locationForm').dataset.id;q('locationForm').innerHTML=locationFields(type,{id,enabled:true,timeoutMs:30000,basePath:type==='sftp'?'/':''});q('locationForm').dataset.id=id;locationAuthChanged()}function locationAuthChanged(){const a=q('lAuth');document.querySelectorAll('.auth-password').forEach(x=>x.classList.toggle('hidden',a&&a.value!=='password'));document.querySelectorAll('.auth-key').forEach(x=>x.classList.toggle('hidden',!a||a.value!=='privateKey'))}
function value(id,def=''){return q(id)?q(id).value:def}function checked(id){return Boolean(q(id)?.checked)}
function collectLocation(){const type=value('lType'),base={id:q('locationForm').dataset.id,name:value('lName').trim(),description:value('lDescription').trim()||undefined,type,enabled:checked('lEnabled'),readOnly:checked('lReadOnly'),timeoutMs:Number(value('lTimeout'))};if(type==='local')return base.type='local',Object.assign(base,{basePath:value('lBasePath').trim()});if(type==='smb')return Object.assign(base,{host:value('lHost').trim(),port:Number(value('lPort')),share:value('lShare').trim(),domain:value('lDomain').trim()||undefined,username:value('lUsername').trim(),basePath:value('lBasePath').trim()});return Object.assign(base,{host:value('lHost').trim(),port:Number(value('lPort')),username:value('lUsername').trim(),auth:value('lAuth'),basePath:value('lBasePath').trim(),hostFingerprint:value('lFingerprint').trim(),allowInsecureHostKey:checked('lInsecure')})}
async function saveLocation(){try{const location=collectLocation(),secret={};if(value('lPassword'))secret.password=value('lPassword');if(value('lPrivateKey'))secret.privateKey=value('lPrivateKey');if(value('lPassphrase'))secret.passphrase=value('lPassphrase');await call('saveLocation',{location,...(Object.keys(secret).length?{secret}:{})});if(q('lPassword'))q('lPassword').value='';if(q('lPrivateKey'))q('lPrivateKey').value='';if(q('lPassphrase'))q('lPassphrase').value='';toast('Datenort gespeichert',true);closeModal();await refresh()}catch(e){err(e)}}async function deleteLocationSecret(){if(!confirm('Gespeichertes Passwort bzw. Schlüssel wirklich löschen?'))return;try{await call('saveLocation',{location:collectLocation(),deleteSecret:true});toast('Credentials gelöscht',true);closeModal();await refresh()}catch(e){err(e)}}
async function testLocation(id){const start=performance.now();try{await call('testLocation',{locationId:id});toast(`Verbindung erfolgreich – ${Math.round(performance.now()-start)} ms`,true)}catch(e){err(e)}}function duplicateLocation(id){editLocation(id,true)}async function removeLocation(id){if(!confirm('Datenort wirklich löschen?'))return;try{await call('deleteLocation',{locationId:id});toast('Datenort gelöscht',true);await refresh()}catch(e){err(e)}}
function openBrowser(locationId,target,current){browseState={locationId,target,path:current||'',offset:0,entries:[]};modal(`<div class="toolbar"><h2>Ordner auswählen</h2><button class="btnx secondary" onclick="${target?'closeTopModal()':'closeModal()'}">Schließen</button></div><div id="breadcrumbs"></div><div id="browserEntries" class="card">Lädt…</div><div><button class="btnx secondary" onclick="browseBack()">Zurück</button><button class="btnx secondary" onclick="browseTo('')">Root</button><button class="btnx secondary" onclick="browseLoad(false)">Refresh</button><button id="moreFolders" class="btnx secondary hidden" onclick="browseLoad(true)">Weitere laden</button>${target?'<button class="btnx" onclick="selectFolder()">Diesen Ordner auswählen</button>':''}</div>`,Boolean(target));browseLoad(false)}
function pathJoin(a,b){return[a,b].filter(Boolean).join('/').replace(/\\/g,'/').replace(/^\/+|\/+$/g,'')}function browseTo(p){browseState.path=p;browseState.offset=0;browseLoad(false)}function browseBack(){const p=browseState.path.split('/').filter(Boolean);p.pop();browseTo(p.join('/'))}
async function browseLoad(more){try{if(!more){browseState.offset=0;browseState.entries=[]}const d=await call('browseLocation',{locationId:browseState.locationId,path:browseState.path,offset:browseState.offset,limit:100});browseState.entries.push(...d.entries);browseState.offset=browseState.entries.length;const parts=browseState.path.split('/').filter(Boolean);q('breadcrumbs').innerHTML=`<button class="crumb" onclick="browseTo('')">/</button>`+parts.map((p,i)=>` / <button class="crumb" onclick="browseTo('${E(parts.slice(0,i+1).join('/'))}')">${E(p)}</button>`).join('');q('browserEntries').innerHTML=browseState.entries.length?browseState.entries.map(x=>`<button class="browser-entry" onclick="browseTo('${E(pathJoin(browseState.path,x.name))}')">📁 ${E(x.name)}</button>`).join(''):'<p>Keine Unterordner.</p>';q('moreFolders').classList.toggle('hidden',!d.hasMore)}catch(e){err(e);q('browserEntries').innerHTML=`<p class="danger-note">${E(e.message)}</p>`}}function selectFolder(){const target=browseState.target,path=browseState.path;closeTopModal();q(target).value=path}
function nameOf(id){return locationList.find(l=>l.id===id)?.name||id}function renderJobs(){q('jobsBody').innerHTML=jobList.length?jobList.map(j=>`<tr><td data-label="Name">${E(j.name)}</td><td data-label="Source">${E(nameOf(j.sourceLocationId))}/${E(j.sourcePath)}</td><td data-label="Target">${E(nameOf(j.targetLocationId))}/${E(j.targetPath)}</td><td data-label="Mode">${E(j.mode)}</td><td data-label="Trigger">${E(j.trigger.type)}</td><td data-label="Enabled">${j.enabled?'✓':'✕'}</td><td data-label="DryRun">${j.dryRun?'✓':'✕'}</td><td data-label="Status"><span class="pill" id="status-${j.id}">idle</span></td><td data-label="Aktionen"><button class="btnx" onclick="startJob('${j.id}',true)">Vorschau</button><button class="btnx ${j.dryRun?'secondary':''}" onclick="startJob('${j.id}',false)">Starten</button><button class="btnx secondary" onclick="editJob('${j.id}')">Bearbeiten</button><button class="btnx secondary" onclick="toggleJob('${j.id}')">${j.enabled?'Deaktivieren':'Aktivieren'}</button><button class="btnx danger" onclick="removeJob('${j.id}')">Löschen</button></td></tr>`).join(''):'<tr><td colspan="9">Noch keine Jobs.</td></tr>'}
function editJob(id){const old=jobList.find(x=>x.id===id),now=new Date().toISOString(),j=old||{id:uuid(),name:'',description:'',enabled:true,sourceLocationId:'',sourcePath:'',targetLocationId:'',targetPath:'',mode:'incremental',mirrorDeleteConfirmed:false,dryRun:true,recursive:true,preserveTimestamps:true,hashCheck:false,stabilitySeconds:5,conflict:'changed',trigger:{type:'manual',intervalSeconds:300},filters:{include:[],exclude:[]},retry:{attempts:2,baseDelayMs:1000,exponential:true,maxDelayMs:30000},notificationGroupIds:[],createdAt:now,updatedAt:now};const opts=locationList.map(l=>`<option value="${l.id}">${E(l.name)} (${l.type})</option>`).join('');modal(`<div class="toolbar"><h2>${old?'Job bearbeiten':'Job hinzufügen'}</h2><button class="btnx secondary" onclick="closeModal()">Schließen</button></div><div id="jobForm" data-id="${j.id}" data-created="${j.createdAt}" class="form-grid"><div class="field"><label>Name *</label><input id="jName" value="${E(j.name)}"></div><div class="field"><label>Beschreibung</label><input id="jDescription" value="${E(j.description||'')}"></div><div class="checks span2"><label><input id="jEnabled" type="checkbox" ${j.enabled?'checked':''}> Aktiv</label></div><div class="field"><label>Quelle</label><select id="jSource">${opts}</select></div><div class="field"><label>Source-Unterordner</label><div><input id="jSourcePath" value="${E(j.sourcePath)}"><button class="btnx secondary" onclick="browseForJob('source')">Ordner auswählen</button></div></div><div class="field"><label>Ziel</label><select id="jTarget">${opts}</select></div><div class="field"><label>Target-Unterordner</label><div><input id="jTargetPath" value="${E(j.targetPath)}"><button class="btnx secondary" onclick="browseForJob('target')">Ordner auswählen</button></div></div><div class="field"><label>Modus</label><select id="jMode" onchange="jobWarnings()"><option value="incremental">Neue/geänderte Dateien</option><option value="full">Vollständig kopieren</option><option value="mirror">Spiegeln</option><option value="move">Verschieben</option></select></div><div class="field"><label>Trigger</label><select id="jTrigger" onchange="jobWarnings()"><option value="manual">Manuell</option><option value="interval">Intervall</option><option value="change">Änderung/Reconciliation</option></select><label>Intervall (Sekunden, min. 30)</label><input id="jInterval" type="number" min="30" value="${j.trigger.intervalSeconds}"></div><div class="checks span2"><label><input id="jDryRun" type="checkbox" onchange="jobWarnings()" ${j.dryRun?'checked':''}> Nur Vorschau / Dry Run</label><label id="mirrorConfirm"><input id="jMirrorConfirm" type="checkbox" ${j.mirrorDeleteConfirmed?'checked':''}> Ich bestätige, dass Dateien im Ziel gelöscht werden dürfen.</label></div><div id="jobWarning" class="warning span2"></div><details class="span2"><summary>Weitere Optionen</summary><div class="form-grid"><div class="checks span2"><label><input id="jRecursive" type="checkbox" ${j.recursive?'checked':''}> Recursive</label><label><input id="jPreserve" type="checkbox" ${j.preserveTimestamps?'checked':''}> Preserve timestamps</label><label><input id="jHash" type="checkbox" ${j.hashCheck?'checked':''}> SHA-256</label></div><div class="field"><label>Stability Seconds</label><input id="jStability" type="number" value="${j.stabilitySeconds}"></div><div class="field"><label>Conflict</label><select id="jConflict"><option value="changed">changed</option><option value="always">always</option><option value="never">never</option><option value="error">error</option><option value="version">version</option></select></div><div class="field"><label>Include (eine Glob-Zeile)</label><textarea id="jInclude">${E(j.filters.include.join('\n'))}</textarea></div><div class="field"><label>Exclude (eine Glob-Zeile)</label><textarea id="jExclude">${E(j.filters.exclude.join('\n'))}</textarea></div><div class="field"><label>Retries</label><input id="jAttempts" type="number" value="${j.retry.attempts}"></div><div class="field"><label>Base delay (ms)</label><input id="jDelay" type="number" value="${j.retry.baseDelayMs}"></div><div class="checks"><label><input id="jExponential" type="checkbox" ${j.retry.exponential?'checked':''}> Exponential</label></div></div></details></div><button class="btnx" onclick="saveJob()">Speichern</button></div>`);q('jSource').value=j.sourceLocationId;q('jTarget').value=j.targetLocationId;q('jMode').value=j.mode;q('jTrigger').value=j.trigger.type;q('jConflict').value=j.conflict;jobWarnings()}
function jobWarnings(){const mode=value('jMode'),dry=checked('jDryRun');q('mirrorConfirm').classList.toggle('hidden',mode!=='mirror'||dry);q('jobWarning').className=`${dry?'warning':'warning danger-note'} span2`;q('jobWarning').textContent=dry?'Vorschau-Modus – es werden keine Dateien verändert.':mode==='mirror'?'Dieser Job kann Dateien verändern und im Ziel löschen.':mode==='move'?'Dieser Job kann Dateien verändern und Quelldateien verschieben.':'Dieser Job kann Dateien verändern.'}
function browseForJob(which){const loc=value(which==='source'?'jSource':'jTarget'),target=which==='source'?'jSourcePath':'jTargetPath';if(!loc)return err(new Error('Bitte zuerst einen Datenort auswählen.'));const snapshot=collectJob();openBrowser(loc,target,value(target));browseState.jobSnapshot=snapshot}
function lines(id){return value(id).split(/\r?\n|,/).map(x=>x.trim()).filter(Boolean)}function collectJob(){const now=new Date().toISOString();return{id:q('jobForm').dataset.id,name:value('jName').trim(),description:value('jDescription').trim(),enabled:checked('jEnabled'),sourceLocationId:value('jSource'),sourcePath:value('jSourcePath').trim(),targetLocationId:value('jTarget'),targetPath:value('jTargetPath').trim(),mode:value('jMode'),mirrorDeleteConfirmed:checked('jMirrorConfirm'),dryRun:checked('jDryRun'),recursive:checked('jRecursive'),preserveTimestamps:checked('jPreserve'),hashCheck:checked('jHash'),stabilitySeconds:Number(value('jStability')),conflict:value('jConflict'),trigger:{type:value('jTrigger'),intervalSeconds:Math.max(30,Number(value('jInterval'))||30)},filters:{include:lines('jInclude'),exclude:lines('jExclude')},retry:{attempts:Number(value('jAttempts')),baseDelayMs:Number(value('jDelay')),exponential:checked('jExponential'),maxDelayMs:30000},notificationGroupIds:[],createdAt:q('jobForm').dataset.created,updatedAt:now}}
async function saveJob(){try{const job=collectJob();if(job.mode==='mirror'&&!job.dryRun&&!job.mirrorDeleteConfirmed)throw new Error('Produktives Spiegeln erfordert die Lösch-Bestätigung.');await call('saveJob',{job});toast('Job gespeichert',true);closeModal();await refresh()}catch(e){err(e)}}async function removeJob(id){if(!confirm('Job wirklich löschen?'))return;try{await call('deleteJob',{id});toast('Job gelöscht',true);await refresh()}catch(e){err(e)}}async function toggleJob(id){try{const j=structuredClone(jobList.find(x=>x.id===id));j.enabled=!j.enabled;j.updatedAt=new Date().toISOString();await call('saveJob',{job:j});await refresh()}catch(e){err(e)}}
async function startJob(id,preview){try{const result=await call(preview?'previewJob':'runJob',{id});q(`status-${id}`).textContent=result.queued?'queued':'running';showRun(id,result.runId,result.dryRun);pollRun(id,result.runId)}catch(e){err(e)}}function showRun(jobId,runId,dry){q('runPanel').innerHTML=`<div class="card"><h3>${dry?'Vorschau':'Lauf'} <code>${E(runId)}</code></h3><p>Status: <strong id="runStatus">queued</strong></p><div id="runResult"></div></div>`}
function pollRun(jobId,runId){clearTimeout(runPoll);runPoll=setTimeout(async()=>{try{const r=await call('getRunStatus',{id:runId});if(!r)throw new Error('Run nicht gefunden');q('runStatus').textContent=r.status;const badge=q(`status-${jobId}`);if(badge){badge.textContent=r.status;badge.className=`pill ${r.status==='success'?'success':r.status==='error'||r.status==='cancelled'?'error':''}`}if(r.status==='success'||r.status==='error'||r.status==='cancelled'){if(r.status!=='success')q('runResult').innerHTML=`<p class="danger-note">${E(r.redactedError||`Run ${r.status}`)}</p>`;else await renderRunResult(runId,r.summary);await refresh();return}if(r.status!=='queued'&&r.status!=='running')throw new Error(`Unbekannter Run-Status: ${r.status}`);pollRun(jobId,runId)}catch(e){err(e)}},700)}
async function renderRunResult(runId,s={}){const d=await call('getRunItems',{id:runId,offset:0,limit:500});q('runResult').innerHTML=`<div class="grid run-summary">${[['Gescannt',s.scanned],['Kopieren',s.wouldCopy],['Überschreiben',s.wouldOverwrite],['Versionieren',s.wouldVersion],['Verschieben',s.wouldMove],['Löschen',s.wouldDelete],['Bytes',s.bytes]].map(x=>`<div><b>${E(x[0])}</b><br>${E(x[1]??0)}</div>`).join('')}</div><h4>Details (${d.items.length}/${d.total})</h4><div class="run-items">${d.items.map(x=>`<div>${E(x.action)} — ${E(x.path)}</div>`).join('')||'Keine Aktionen.'}</div>${d.total>d.items.length?'<p class="warning">Weitere Details wurden aus Speichergründen nicht gespeichert.</p>':''}`}
function resolveAdapterInstance(settings){const official=typeof instance!=='undefined'?instance:null,fromId=settings&&typeof settings._id==='string'?settings._id.split('.').pop():null,candidate=official!==null&&official!==''?official:fromId;if(!/^\d+$/.test(String(candidate)))throw new Error('ioBroker Admin instance information is unavailable');return Number(candidate)}
function load(settings,onChange){nativeSettings=settings||{};try{adapterInstance=resolveAdapterInstance(settings);if(checkAdminApi())refresh()}catch(e){err(e)}onChange(false)}function save(callback){callback(nativeSettings)}
</script></body></html>
